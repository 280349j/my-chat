<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルチャット</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }
    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { background: #fff; padding: 10px 14px; border-radius: 12px; max-width: 80%; align-self: flex-start; word-break: break-all; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
    #input-form { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    label { cursor: pointer; font-size: 20px; padding: 0 5px; }
    input[type="file"] { display: none; }
    button { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

  <div id="chat-box"></div>

  <form id="input-form">
    <label for="img-input" title="画像を添付">📷</label>
    <input type="file" id="img-input" accept="image/*">
    <input type="text" id="msg-input" placeholder="メッセージを入力...">
    <button type="submit" id="send-btn">送信</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqY58yv3shln5FlJLVOJ2h2ob2CdEkM1g",
      authDomain: "my-chat-15180.firebaseapp.com",
      projectId: "my-chat-15180",
      storageBucket: "my-chat-15180.firebasestorage.app",
      messagingSenderId: "1028992980813",
      appId: "1:1028992980813:web:495b4357be576e54cf4904",
      measurementId: "G-PLGB67NHHG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // URLのパラメータから部屋IDを取得（例: ?room=123）
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';

    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('input-form');
    const msgInput = document.getElementById('msg-input');
    const imgInput = document.getElementById('img-input');
    const sendBtn = document.getElementById('send-btn');

    // 受信処理
    const q = query(collection(db, "rooms", roomId, "messages"), orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      chatBox.innerHTML = '';
      snapshot.forEach((doc) => {
        const data = doc.data();
        const div = document.createElement('div');
        div.className = 'message';
        if (data.text) div.textContent = data.text;
        if (data.imageUrl) {
          const img = document.createElement('img');
          img.src = data.imageUrl;
          img.loading = "lazy";
          div.appendChild(img);
        }
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // 送信処理
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      const file = imgInput.files[0];
      if (!text && !file) return;

      sendBtn.disabled = true;

      let imageUrl = '';
      if (file) {
        const storageRef = ref(storage, `images/${Date.now()}_${file.name}`);
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
      }

      await addDoc(collection(db, "rooms", roomId, "messages"), {
        text: text,
        imageUrl: imageUrl,
        createdAt: serverTimestamp()
      });

      msgInput.value = '';
      imgInput.value = '';
      sendBtn.disabled = false;
    });
  </script>
</body>
</html>
